<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>poke</title>
<style>body{margin:0;font:13px/1.5 monospace}#bar{padding:8px 12px;background:#333;color:#eee}</style>
</head>
<body>
<div id="bar"><span id="info">running…</span></div>
<iframe id="frame" src="page.html" scrolling="auto"
	style="border:0;width:100%;height:80vh;min-height:480px;display:block;background:transparent"></iframe>
<script>
/* A/B 探针：反复向子页面丢 resize 事件（相当于「窗口变了 / 又渲染了一次」），
 * 观察 iframe 高度是否收敛。mode=old 用修复前的父页面规则，mode=new 用现在的。 */
var q = new URLSearchParams(location.search);
var mode = q.get('mode') || 'new';
var frame = document.getElementById('frame');
if (q.get('f')) frame.src = q.get('f');

window.addEventListener('message', function (ev) {
	if (ev.origin !== location.origin || !ev.data) return;
	var h = parseInt(ev.data.opshareHeight, 10);
	if (mode === 'old') {
		if (isFinite(h) && h > 200 && h < 20000) frame.style.height = (h + 24) + 'px';
	} else {
		if (!isFinite(h) || h < 200) return;
		if (h > 12000) h = 12000;
		if (Math.abs(frame.offsetHeight - h) < 3) return;
		frame.style.height = h + 'px';
	}
});

var heights = [], i = 0;
function step() {
	heights.push(frame.offsetHeight);
	if (i++ >= 8) {
		document.getElementById('info').textContent = 'H=' + heights.join(' → ');
		document.title = 'DONE';
		return;
	}
	try { frame.contentWindow.dispatchEvent(new Event('resize')); } catch (e) {}
	setTimeout(step, 150);
}
window.addEventListener('load', function () { setTimeout(step, 600); });
</script>
</body>
</html>
